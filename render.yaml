services:
  - type: web
    name: shop-presence-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ADMIN_SECRET_CODE
        value: ADMIN2026
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_PROVIDER
        value: mr_lad
      - key: WHATSAPP_PHONE_NUMBER
        value: "+917780181920"
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1407135925808911"
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        value: "2912980445715643"
      - key: LAD_API_BASE_URL
        value: https://lad-waba-comms-stage-asia-axxjxdzmbq-el.a.run.app
      - key: LAD_AUTH_BASE_URL
        value: https://lad-backend-stage-axxjxdzmbq-uc.a.run.app
      - key: LAD_AUTH_EMAIL
        value: api@lexonit.com
      - key: LAD_AUTH_PASSWORD
        sync: false
      - key: LAD_API_TOKEN
        sync: false
      - key: WHATSAPP_DEFAULT_TEMPLATE_NAME
        value: signup_otp
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        value: shoppresence_whatsapp_webhook_token_123
      - key: WHATSAPP_API_VERSION
        value: v22.0
      - key: WHATSAPP_IS_TEST_MODE
        value: "false"
